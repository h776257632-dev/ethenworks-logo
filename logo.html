<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EthenWorks Logo Exporter</title>
  <style>
    :root {
      --navy: #0f2c4a;
      --cyan: #00b8d4;
      --bg: #f4f8fb;
      --line: #dce5ee;
      --muted: #6b7c8e;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--navy);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
    }

    header {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 40px;
      display: grid;
      grid-template-columns: minmax(420px, 1fr) minmax(420px, 0.9fr);
      gap: 20px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 48px rgba(15, 44, 74, 0.08);
      overflow: hidden;
    }

    .panel-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--navy);
    }

    .preview-wrap {
      padding: 28px;
    }

    .preview-box {
      background:
        linear-gradient(45deg, #f1f5f8 25%, transparent 25%),
        linear-gradient(-45deg, #f1f5f8 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f1f5f8 75%),
        linear-gradient(-45deg, transparent 75%, #f1f5f8 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .preview-box svg {
      width: 100%;
      max-height: 280px;
      display: block;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 0 28px 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    input, select {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 12px;
      font: inherit;
      color: var(--navy);
      background: #fff;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 184, 212, 0.14);
    }

    .check-row {
      flex-direction: row;
      align-items: center;
      gap: 10px;
      min-height: 40px;
    }

    .check-row input {
      width: 18px;
      height: 18px;
    }

    .actions {
      padding: 0 28px 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      height: 40px;
      border: 0;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      background: var(--navy);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button.secondary {
      background: var(--cyan);
      color: #062334;
    }

    button.ghost {
      background: #eaf4f8;
      color: var(--navy);
    }

    .code-wrap {
      padding: 0;
    }

    textarea {
      width: 100%;
      height: 620px;
      display: block;
      resize: vertical;
      border: 0;
      outline: none;
      padding: 20px;
      background: #071827;
      color: #dff9ff;
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      tab-size: 2;
    }

    .hint {
      padding: 12px 20px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>EthenWorks｜一东工坊 Logo 导出工具</h1>
    <p class="sub">已去掉“一东工坊”前后所有横杠：SVG 矢量预览 + 源码显示 + 任意尺寸 PNG/SVG 导出 + 透明背景 + 紧凑裁剪。</p>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">Logo 预览</div>
        <button class="ghost" onclick="resetOptions()">恢复默认</button>
      </div>

      <div class="preview-wrap">
        <div class="preview-box" id="preview"></div>
      </div>

      <div class="controls">
        <div class="field">
          <label for="exportWidth">导出宽度 px</label>
          <input id="exportWidth" type="number" value="2400" min="16" step="1" />
        </div>

        <div class="field">
          <label for="exportHeight">导出高度 px</label>
          <input id="exportHeight" type="number" value="720" min="16" step="1" />
        </div>

        <div class="field">
          <label for="cropMode">裁剪模式</label>
          <select id="cropMode">
            <option value="full">完整画布 1200×360</option>
            <option value="tight" selected>紧凑裁剪，适合网页/PPT</option>
            <option value="icon">只导出左侧 EW 图标</option>
            <option value="wordmark">只导出右侧字标</option>
          </select>
        </div>

        <div class="field">
          <label for="padding">内边距 px，SVG 坐标单位</label>
          <input id="padding" type="number" value="24" min="0" max="200" step="1" />
        </div>

        <div class="field check-row">
          <input id="transparent" type="checkbox" checked />
          <label for="transparent">透明背景</label>
        </div>

        <div class="field check-row">
          <input id="autoRatio" type="checkbox" checked />
          <label for="autoRatio">按裁剪比例自动高度</label>
        </div>
      </div>

      <div class="actions">
        <button onclick="downloadSvg()">下载 SVG</button>
        <button class="secondary" onclick="downloadPng()">导出 PNG</button>
        <button class="ghost" onclick="copySvg()">复制 SVG 代码</button>
      </div>

      <div class="hint">
        建议：网页/PPT 用“紧凑裁剪 + 透明背景”；软件图标用“只导出左侧 EW 图标”；印刷或设计软件继续使用 SVG。
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">当前 SVG 源码</div>
        <button class="ghost" onclick="selectCode()">全选代码</button>
      </div>

      <div class="code-wrap">
        <textarea id="svgCode" spellcheck="false"></textarea>
      </div>
    </section>
  </main>

  <script>
    const viewBoxes = {
      full: { x: 0, y: 0, w: 1200, h: 360 },
      tight: { x: 72, y: 78, w: 1064, h: 210 },
      icon: { x: 72, y: 78, w: 506, h: 230 },
      wordmark: { x: 620, y: 112, w: 516, h: 176 }
    };

    function getOptions() {
      const cropMode = document.getElementById("cropMode").value;
      const padding = Number(document.getElementById("padding").value || 0);
      const transparent = document.getElementById("transparent").checked;
      const autoRatio = document.getElementById("autoRatio").checked;
      const widthInput = document.getElementById("exportWidth");
      const heightInput = document.getElementById("exportHeight");

      const base = viewBoxes[cropMode];
      const box = {
        x: base.x - padding,
        y: base.y - padding,
        w: base.w + padding * 2,
        h: base.h + padding * 2
      };

      if (autoRatio) {
        const width = Number(widthInput.value || 2400);
        heightInput.value = Math.round(width * box.h / box.w);
      }

      return {
        cropMode,
        padding,
        transparent,
        autoRatio,
        width: Number(widthInput.value || 2400),
        height: Number(heightInput.value || 720),
        box
      };
    }

    function buildSvg() {
      const opt = getOptions();
      const bgRect = opt.transparent
        ? ""
        : `  <rect x="${opt.box.x}" y="${opt.box.y}" width="${opt.box.w}" height="${opt.box.h}" fill="#FFFFFF"/>`;

      return `<svg width="${opt.width}" height="${opt.height}" viewBox="${opt.box.x} ${opt.box.y} ${opt.box.w} ${opt.box.h}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="a1" x1="110" y1="82" x2="338" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F2C4A"/>
      <stop offset="1" stop-color="#163E66"/>
    </linearGradient>

    <linearGradient id="a2" x1="250" y1="88" x2="420" y2="254" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35E6FF"/>
      <stop offset="1" stop-color="#00A7C8"/>
    </linearGradient>
  </defs>

${bgRect}

  <g transform="translate(72 78)">
    <path d="M32 0H246L224 44H75C63 44 58 49 54 60L43 92H209L188 133H31L20 166C16 178 22 186 35 186H224L246 230H34C7 230 -7 207 2 180L47 50C58 17 14 0 32 0Z" fill="url(#a1)"/>
    <path d="M239 0H292L350 153L424 0H477L368 230H328L271 80L214 230H174L103 133H158L195 185L263 42L239 0Z" fill="url(#a1)"/>
    <path d="M344 230L452 0H506L398 230H344Z" fill="url(#a2)"/>
    <path d="M70 91H200C216 91 227 98 236 112L250 133H36L70 91Z" fill="url(#a2)"/>
  </g>

  <g transform="translate(620 112)">
    <text x="0" y="76"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      font-size="78"
      font-weight="800"
      letter-spacing="-3"
      fill="#0F2C4A">EthenWorks</text>

    <g transform="translate(102 126)">
      <text x="0" y="36"
        font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif"
        font-size="42"
        font-weight="600"
        letter-spacing="14"
        fill="#0F2C4A">一东工坊</text>
    </g>
  </g>
</svg>`;
    }

    function render() {
      const svg = buildSvg();
      document.getElementById("preview").innerHTML = svg;
      document.getElementById("svgCode").value = svg;
    }

    function downloadText(filename, text, mime) {
      const blob = new Blob([text], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadSvg() {
      downloadText("ethenworks-logo.svg", buildSvg(), "image/svg+xml;charset=utf-8");
    }

    function downloadPng() {
      const opt = getOptions();
      const svg = buildSvg();
      const svgBlob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = opt.width;
        canvas.height = opt.height;

        const ctx = canvas.getContext("2d");
        if (!opt.transparent) {
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, opt.width, opt.height);
        }

        ctx.drawImage(img, 0, 0, opt.width, opt.height);

        URL.revokeObjectURL(url);

        canvas.toBlob(function (blob) {
          const pngUrl = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = pngUrl;
          a.download = `ethenworks-logo-${opt.width}x${opt.height}.png`;
          a.click();
          URL.revokeObjectURL(pngUrl);
        }, "image/png");
      };

      img.onerror = function () {
        URL.revokeObjectURL(url);
        alert("PNG 导出失败。可以先下载 SVG，再用浏览器或 Inkscape 转 PNG。");
      };

      img.src = url;
    }

    async function copySvg() {
      const svg = buildSvg();
      try {
        await navigator.clipboard.writeText(svg);
        alert("SVG 代码已复制。");
      } catch (e) {
        const area = document.getElementById("svgCode");
        area.focus();
        area.select();
        document.execCommand("copy");
        alert("SVG 代码已复制。");
      }
    }

    function selectCode() {
      const area = document.getElementById("svgCode");
      area.focus();
      area.select();
    }

    function resetOptions() {
      document.getElementById("exportWidth").value = 2400;
      document.getElementById("exportHeight").value = 720;
      document.getElementById("cropMode").value = "tight";
      document.getElementById("padding").value = 24;
      document.getElementById("transparent").checked = true;
      document.getElementById("autoRatio").checked = true;
      render();
    }

    ["exportWidth", "exportHeight", "cropMode", "padding", "transparent", "autoRatio"].forEach(id => {
      document.addEventListener("input", event => {
        if (event.target && event.target.id === id) render();
      });
      document.addEventListener("change", event => {
        if (event.target && event.target.id === id) render();
      });
    });

    render();
  </script>
</body>
</html>
